<canvas id="cv"></canvas>
<div id="labels"></div>
<div id="binoc" hidden></div>

<div id="hud" hidden>
  <div id="top" class="panel">
    <button id="bPause" class="ib" aria-label="Pause"><svg><use id="uPause" href="#i-pause"/></svg></button>
    <div class="tb clock"><b id="hClock">12:34</b><small id="hDate"></small></div>
    <div class="tb"><svg class="ic wx"><use id="uWx" href="#i-sun"/></svg><b id="hTemp">18°C</b></div>
    <div class="tb cy"><svg class="ic arr"><use href="#i-plane"/></svg><b id="hArr">0</b></div>
    <div class="tb cy"><svg class="ic dep"><use href="#i-plane"/></svg><b id="hDep">0</b></div>
    <div class="tb sat"><svg class="ic gr"><use id="uSmile" href="#i-smile"/></svg><div class="two"><b id="hSat">92%</b><small data-i="satLabel"></small></div></div>
    <div class="tb money"><svg class="ic gr"><use href="#i-dollar"/></svg><div class="two"><b id="hMoney">0</b><small id="hRate" class="gr"></small></div></div>
    <span class="sp"></span>
    <button id="bBinoc" class="ib" aria-label="Binoculars" title="Binoculars (B)"><svg><use href="#i-bino"/></svg></button>
    <button id="bGear" class="ib" aria-label="Settings"><svg><use href="#i-gear"/></svg></button>
  </div>
  <button id="bBack" class="panel" hidden>&#8592; <span data-i="back"></span></button>
  <div id="pauseTag" hidden data-i="paused"></div>
  <div id="alertBox" hidden><div class="ah"><span id="aTitle"></span><span id="aTime"></span></div><div id="aMsg"></div></div>
  <div id="hint" data-i="hint"></div>
</div>

<div class="modal" id="mMenu">
  <div class="card panel">
    <h1 data-i="title"></h1><p data-i="tag"></p>
    <h4 data-i="airport"></h4><div class="row" id="apBtns"></div>
    <h4 data-i="diff"></h4><div class="row" id="dfBtns"></div>
    <h4 data-i="lang"></h4><div class="row" id="lgBtns"></div>
    <div class="row"><button id="bSnd"></button><button id="bShop" data-i="shop"></button></div>
    <div class="row main"><button id="bCont" class="big" data-i="cont"></button><button id="bNew" class="big alt" data-i="newg"></button></div>
  </div>
</div>
<div class="modal" id="mShop" hidden><div class="card panel"><h1 data-i="shop"></h1><div id="shopList"></div><button id="bShopX" class="big alt" data-i="close"></button></div></div>
<div class="modal over" id="mOver" hidden><div class="card panel"><h1 data-i="over"></h1><p id="overTxt"></p><p id="overStats"></p><button id="bRetry" class="big" data-i="retry"></button></div></div>
<div id="rotate" data-i="rotate"></div>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
